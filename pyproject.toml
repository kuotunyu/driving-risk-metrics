[build-system]
requires = ["setuptools>=80", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "driving-risk-metrics"
version = "0.1.0"
description = "Safety-aware evaluation for road-scene semantic segmentation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kuo Tun-Yu" }]
keywords = [
    "autonomous-driving",
    "evaluation",
    "safety",
    "semantic-segmentation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3",
    "pillow>=10,<13",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
    "scipy>=1.14,<2",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
train = [
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "tqdm>=4.66,<5",
    "transformers>=4.45,<6",
]
report = [
    "jinja2>=3.1,<4",
    "matplotlib>=3.9,<4",
    "plotly>=6,<7",
]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "hypothesis>=6.130,<7",
    "mypy>=1.15,<2",
    "mutmut>=3.3,<4",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-pyyaml>=6.0,<7",
]
report = [
    "jinja2>=3.1,<4",
    "matplotlib>=3.9,<4",
    "plotly>=6,<7",
]

[project.scripts]
driving-risk = "drivemetrics.cli.app:app"

[project.urls]
Homepage = "https://github.com/kuotunyu/driving-risk-metrics"
Issues = "https://github.com/kuotunyu/driving-risk-metrics/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drivemetrics = ["report/templates/*.j2"]

[tool.uv]
required-version = ">=0.11.18,<0.12"
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = [
    "slow: needs real data, a trained model, or another explicitly gated resource",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
branch = true
source = ["drivemetrics"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_configs = true

[tool.mutmut]
# Release-gate mutation testing of the pure core only. Adapters, CLI, report and
# training glue are covered by the 100% branch gate but are not scored here.
source_paths = ["src"]
only_mutate = [
    "src/drivemetrics/metrics/*",
    "src/drivemetrics/calibration/*",
    "src/drivemetrics/analysis/*",
    "src/drivemetrics/protocol/*",
]
also_copy = ["configs", "schemas", "docs"]
# Two test files are excluded because they read source that mutmut rewrites or
# does not copy, so their verdicts inside the sandbox describe the sandbox
# rather than the project: the skill contracts read .agents/, and the
# artifact-bytes contract scans src/ for writers, which the mutant tree
# deliberately alters.
pytest_add_cli_args = [
    "-p", "no:cacheprovider", "-x", "-q",
    "--ignore=tests/contract/skills",
    "--ignore=tests/contract/test_artifact_bytes.py",
]
pytest_add_cli_args_test_selection = ["tests/unit", "tests/integration", "tests/contract"]
