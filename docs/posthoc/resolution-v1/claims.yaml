- claim_id: p1.posthoc.resolution.segformer
  text: Post-release, on the calibration split and averaged over three seeds, SegFormer-B2 misses 0.748356807511737
    of small people at the formal input scale, 0.6328638497652582 at s085 and 0.6582159624413145 at native;
    the pre-registered formal minus native difference is 0.09014084507042254 with Bonferroni-adjusted
    bootstrap interval 0.034651028223118975 to 0.1461138365633627 (category B). Seed-mean mIoU is 0.5550429656739747
    at formal and 0.5280155107415259 at native, and the large-person formal minus native difference is
    -0.04368471035137702 (descriptive interval -0.07867835877188757 to -0.013070074826588044).
  evidence_type: observed
  protocol_hash: b33c842250f6afcc7bd7c1108b29bf84f342dda5bb5420e64d6be48773c4369f
