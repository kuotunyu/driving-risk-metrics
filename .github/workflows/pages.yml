name: Pages

# Publishes the static evidence report. It runs only when a human pushes `main`
# or triggers it by hand, builds from the committed evidence alone, and deploys
# nothing that was not first proved by the claims audit. It never pushes a
# commit and never creates a tag.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.18"
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked environment (no training extra; the report needs none)
        run: uv sync --frozen --all-groups

      - name: Refuse to publish a claim that does not reproduce from its artifact
        run: uv run --frozen driving-risk audit-claims --claims docs/claims.yaml

      - name: Refuse to publish a README number without a verified claim behind it
        run: >-
          uv run --frozen python
          .agents/skills/auditing-driving-risk-claims/scripts/validate_claims.py
          --claims docs/claims.yaml --repo-root .
          --document README.md --document README.zh-TW.md

      - name: Build the report from the committed evidence
        run: >-
          uv run --frozen driving-risk report
          --claims docs/claims.yaml
          --artifacts-dir docs/evidence/bdd100k_semseg_v1
          --output-dir site

      - name: Copy the committed figures beside the report
        run: mkdir -p site/figures-svg && cp docs/figures/*.svg site/figures-svg/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
