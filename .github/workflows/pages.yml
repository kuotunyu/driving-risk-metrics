name: Pages

# Publishes the static evidence report. It runs only when a human pushes `main`
# or triggers it by hand, builds from the committed evidence alone, and deploys
# nothing that was not first proved by the claims audit. It never pushes a
# commit and never creates a tag.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.18"
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked environment (no training extra; the report needs none)
        run: uv sync --frozen --all-groups

      - name: Refuse to publish a claim that does not reproduce from its artifact
        run: uv run --frozen driving-risk audit-claims --claims docs/claims.yaml

      - name: Refuse to publish a README number without a verified claim behind it
        run: >-
          uv run --frozen python
          .agents/skills/auditing-driving-risk-claims/scripts/validate_claims.py
          --claims docs/claims.yaml --repo-root .
          --document README.md --document README.en.md
          --document docs/release-notes/v1.0.0.md
          --document docs/release-notes/v1.0.1.md
          --document docs/release-notes/v1.0.2.md
          --document docs/release-notes/v1.1.0.md

      - name: Build the report from the committed evidence
        run: >-
          uv run --frozen driving-risk report
          --claims docs/claims.yaml
          --artifacts-dir docs/evidence/bdd100k_semseg_v1
          --output-dir site

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
