name: Release

# Runs only when a human pushes an annotated `v*` tag. It re-runs the full
# verification gate on the tagged commit, builds the wheel and the source
# distribution from the lock, and attaches them with their SHA-256 sums to a
# GitHub release for that tag. It creates no tag and pushes no commit; the
# human's tag is the only trigger.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.18"
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked development environment
        run: |
          uv lock --check
          uv sync --frozen --all-groups --extra train
          uv run --frozen python -m drivemetrics.release backend

      - name: Run the deterministic verification gate on the tagged commit
        run: uv run --frozen python -m drivemetrics.dev verify

      - name: Pin the build timestamp to the tagged commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build wheel and source distribution
        run: uv run --frozen python -m build --no-isolation --outdir dist

      - name: Normalize demonstrated source-archive timestamp variation
        run: uv run --frozen python -m drivemetrics.release normalize-sdist --dist-dir dist --epoch "$SOURCE_DATE_EPOCH"

      - name: Verify release identities and record portable checksums
        run: uv run --frozen python -m drivemetrics.release verify --dist-dir dist --tag "$GITHUB_REF_NAME"

      - name: Create the GitHub release for this tag with the built assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          --verify-tag
          --title "driving-risk-metrics $GITHUB_REF_NAME"
          --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
