name: CI

on:
  push:
    branches: [main, rebuild/v1]
  pull_request:
    branches: [main, rebuild/v1]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.18"
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked development environment
        run: uv sync --frozen --all-groups --extra train

      - name: Run deterministic verification gate
        run: uv run python -m drivemetrics.dev verify

      - name: Build wheel and source distribution
        run: uv build
